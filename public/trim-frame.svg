<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <path id="leaf" d="M0 0C3 -6 10 -6 13 0C10 6 3 6 0 0Z"/>
    <g id="bloom">
      <g fill="#ffd400" stroke="#0a0a0a" stroke-width="1.2">
        <ellipse cx="0" cy="-7" rx="3.2" ry="5.2"/>
        <ellipse cx="0" cy="7" rx="3.2" ry="5.2"/>
        <ellipse cx="-7" cy="0" rx="5.2" ry="3.2"/>
        <ellipse cx="7" cy="0" rx="5.2" ry="3.2"/>
        <ellipse cx="-5" cy="-5" rx="3" ry="4.6" transform="rotate(-45 -5 -5)"/>
        <ellipse cx="5" cy="5" rx="3" ry="4.6" transform="rotate(-45 5 5)"/>
        <ellipse cx="5" cy="-5" rx="3" ry="4.6" transform="rotate(45 5 -5)"/>
        <ellipse cx="-5" cy="5" rx="3" ry="4.6" transform="rotate(45 -5 5)"/>
      </g>
      <circle r="2.6" fill="#e2231a" stroke="#0a0a0a" stroke-width="1"/>
    </g>
  </defs>

  <!-- outer and inner rules -->
  <g fill="none" stroke="#0a0a0a" stroke-width="1.6" stroke-linejoin="round">
    <rect x="2" y="2" width="116" height="116"/>
    <rect x="38" y="38" width="44" height="44"/>
  </g>

  <!-- vine stems -->
  <g fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round">
    <path d="M40 20 Q50 13 60 20 T80 20"/>
    <path d="M40 100 Q50 107 60 100 T80 100"/>
    <path d="M20 40 Q13 50 20 60 T20 80"/>
    <path d="M100 40 Q107 50 100 60 T100 80"/>
  </g>

  <!-- leaves -->
  <g fill="#8cc63f" stroke="#0a0a0a" stroke-width="1.1">
    <use href="#leaf" transform="translate(44 15) rotate(-28)"/>
    <use href="#leaf" transform="translate(76 25) rotate(152)"/>
    <use href="#leaf" transform="translate(44 105) rotate(28)"/>
    <use href="#leaf" transform="translate(76 95) rotate(208)"/>
    <use href="#leaf" transform="translate(15 44) rotate(62)"/>
    <use href="#leaf" transform="translate(25 76) rotate(242)"/>
    <use href="#leaf" transform="translate(105 44) rotate(118)"/>
    <use href="#leaf" transform="translate(95 76) rotate(298)"/>
  </g>

  <!-- blooms: four corners and four edge centres -->
  <use href="#bloom" transform="translate(20 20)"/>
  <use href="#bloom" transform="translate(100 20)"/>
  <use href="#bloom" transform="translate(20 100)"/>
  <use href="#bloom" transform="translate(100 100)"/>
  <use href="#bloom" transform="translate(60 20) scale(.82)"/>
  <use href="#bloom" transform="translate(60 100) scale(.82)"/>
  <use href="#bloom" transform="translate(20 60) scale(.82)"/>
  <use href="#bloom" transform="translate(100 60) scale(.82)"/>
</svg>
