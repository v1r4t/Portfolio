<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="A dense field of stars over a dark horizon">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040916"/>
      <stop offset="0.45" stop-color="#0d1d3a"/>
      <stop offset="0.8" stop-color="#1d3a5c"/>
      <stop offset="1" stop-color="#46647a"/>
    </linearGradient>
    <radialGradient id="haze">
      <stop offset="0" stop-color="#c9d4ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c9d4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <ellipse cx="600" cy="380" rx="540" ry="120" fill="url(#haze)" transform="rotate(-16 600 380)"/>
  <ellipse cx="600" cy="380" rx="360" ry="58" fill="#dfe4ff" opacity="0.1" transform="rotate(-16 600 380)"/>
  <g fill="#f7f3da">
    <circle cx="90" cy="90" r="2.2"/><circle cx="160" cy="150" r="1.4"/><circle cx="230" cy="70" r="2.8"/>
    <circle cx="300" cy="190" r="1.6"/><circle cx="360" cy="110" r="2"/><circle cx="420" cy="60" r="1.3"/>
    <circle cx="480" cy="170" r="2.4"/><circle cx="540" cy="90" r="1.8"/><circle cx="610" cy="150" r="2.6"/>
    <circle cx="680" cy="70" r="1.5"/><circle cx="740" cy="180" r="2.1"/><circle cx="810" cy="100" r="2.8"/>
    <circle cx="880" cy="55" r="1.4"/><circle cx="950" cy="160" r="2.3"/><circle cx="1020" cy="85" r="1.7"/>
    <circle cx="1090" cy="145" r="2.5"/><circle cx="1150" cy="70" r="1.5"/><circle cx="70" cy="260" r="1.8"/>
    <circle cx="140" cy="330" r="2.2"/><circle cx="210" cy="250" r="1.4"/><circle cx="280" cy="350" r="2.6"/>
    <circle cx="350" cy="280" r="1.6"/><circle cx="420" cy="380" r="2"/><circle cx="500" cy="310" r="1.4"/>
    <circle cx="570" cy="400" r="2.7"/><circle cx="650" cy="330" r="1.8"/><circle cx="730" cy="410" r="2.2"/>
    <circle cx="800" cy="300" r="1.5"/><circle cx="870" cy="390" r="2.4"/><circle cx="940" cy="320" r="1.7"/>
    <circle cx="1010" cy="400" r="2"/><circle cx="1080" cy="280" r="1.4"/><circle cx="1150" cy="360" r="2.3"/>
    <circle cx="110" cy="470" r="2"/><circle cx="190" cy="430" r="1.5"/><circle cx="270" cy="500" r="2.4"/>
    <circle cx="350" cy="450" r="1.7"/><circle cx="440" cy="520" r="2.1"/><circle cx="530" cy="470" r="1.4"/>
    <circle cx="620" cy="530" r="2.6"/><circle cx="710" cy="480" r="1.8"/><circle cx="790" cy="540" r="2.2"/>
    <circle cx="880" cy="490" r="1.5"/><circle cx="960" cy="550" r="2.4"/><circle cx="1040" cy="500" r="1.7"/>
  </g>
  <g fill="#9fc4d8">
    <circle cx="250" cy="120" r="1.2"/><circle cx="390" cy="240" r="1.1"/><circle cx="560" cy="210" r="1.3"/>
    <circle cx="760" cy="150" r="1.2"/><circle cx="910" cy="250" r="1.1"/><circle cx="1060" cy="210" r="1.2"/>
