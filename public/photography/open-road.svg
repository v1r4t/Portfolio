    <circle cx="160" cy="560" r="28"/>
    <path d="M1000 630 l8 -66 h8 l10 66 Z"/>
    <circle cx="1008" cy="560" r="24"/>
  </g>
  <rect width="1200" height="800" fill="#000" filter="url(#grain)" opacity="0.4"/>
