<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="An open road running toward a wide horizon">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d4f7c"/>
      <stop offset="0.45" stop-color="#7fa1b8"/>
      <stop offset="0.72" stop-color="#e7cba4"/>
      <stop offset="1" stop-color="#ffd99b"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8f5a"/>
      <stop offset="1" stop-color="#3d5439"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="640" cy="520" r="180" fill="#ffe6a8" opacity="0.35"/>
  <circle cx="640" cy="520" r="54" fill="#fff0bb"/>
  <g fill="#f6e6c8" opacity="0.35">
    <rect x="70" y="250" width="300" height="12" rx="6"/>
    <rect x="520" y="310" width="420" height="10" rx="5"/>
    <rect x="880" y="220" width="240" height="9" rx="4"/>
  </g>
  <path d="M0 560 L170 500 L340 552 L520 492 L700 555 L880 505 L1060 560 L1200 520 L1200 800 L0 800 Z" fill="#5c6b4a"/>
  <path d="M0 640 L200 590 L400 645 L610 588 L820 648 L1030 600 L1200 645 L1200 800 L0 800 Z" fill="url(#field)"/>
  <path d="M560 800 L620 590 L680 590 L760 800 Z" fill="#3a3a3a"/>
  <path d="M650 800 L657 592 L663 592 L690 800 Z" fill="#ffe8a8" opacity="0.85"/>
  <g stroke="#2d4f7c" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M300 350 q10 -9 20 0 q10 -9 20 0"/>
    <path d="M360 390 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M860 380 q8 -8 16 0 q8 -8 16 0"/>
