<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-label="Palm silhouettes against an orange dusk sky">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38185c"/>
      <stop offset="0.35" stop-color="#a63568"/>
      <stop offset="0.62" stop-color="#f06a55"/>
      <stop offset="0.82" stop-color="#ffb45f"/>
      <stop offset="1" stop-color="#ffe29a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.5" stop-color="#ffcf6e" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffcf6e" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="url(#sky)"/>
