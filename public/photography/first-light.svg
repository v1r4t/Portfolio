<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-label="Pale dawn light and mist over distant hills">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7093ad"/>
      <stop offset="0.4" stop-color="#b8bfbd"/>
      <stop offset="0.68" stop-color="#e8c9a7"/>
      <stop offset="1" stop-color="#f7d7a6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.55" stop-color="#ffdf9e" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffdf9e" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="url(#sky)"/>
  <circle cx="560" cy="760" r="190" fill="url(#glow)"/>
  <circle cx="560" cy="760" r="54" fill="#fff3cf"/>
