    <rect x="0" y="842" width="900" height="30"/>
    <rect x="0" y="920" width="900" height="20"/>
  </g>
  <path d="M0 860 L130 760 L270 840 L420 735 L570 845 L720 770 L900 850 L900 1200 L0 1200 Z" fill="#7e8f8a" opacity="0.55"/>
  <path d="M0 960 L150 870 L300 950 L470 855 L640 955 L790 890 L900 940 L900 1200 L0 1200 Z" fill="#53645f" opacity="0.8"/>
  <path d="M0 1080 L170 990 L340 1070 L520 975 L700 1075 L900 1000 L900 1200 L0 1200 Z" fill="#2c3a35"/>
  <g fill="#1c2723">
