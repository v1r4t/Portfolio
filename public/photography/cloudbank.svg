<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Tall white clouds stacked in a turquoise sky">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f6f83"/>
      <stop offset="0.5" stop-color="#5ec0c4"/>
      <stop offset="1" stop-color="#d9f2ec"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff6cb"/>
      <stop offset="0.5" stop-color="#ffe9a3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe9a3" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="980" cy="170" r="210" fill="url(#glow)"/>
  <g fill="#b9dedb" opacity="0.9">
    <ellipse cx="290" cy="640" rx="280" ry="120"/>
    <ellipse cx="760" cy="690" rx="330" ry="140"/>
  </g>
  <g fill="#fbfffb">
    <ellipse cx="250" cy="590" rx="210" ry="105"/>
    <ellipse cx="380" cy="545" rx="170" ry="120"/>
    <ellipse cx="480" cy="610" rx="230" ry="100"/>
    <ellipse cx="700" cy="640" rx="240" ry="115"/>
    <ellipse cx="840" cy="585" rx="190" ry="130"/>
    <ellipse cx="960" cy="650" rx="220" ry="105"/>
    <ellipse cx="600" cy="700" rx="260" ry="90"/>
  </g>
  <g fill="#e3eeeb" opacity="0.85">
    <ellipse cx="330" cy="655" rx="160" ry="45"/>
    <ellipse cx="780" cy="720" rx="220" ry="55"/>
    <ellipse cx="980" cy="680" rx="150" ry="40"/>
  </g>
  <g stroke="#204a4f" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M210 260 q10 -9 20 0 q10 -9 20 0"/>
    <path d="M270 300 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M160 330 q8 -8 16 0 q8 -8 16 0"/>
  </g>
  <rect width="1200" height="900" fill="#000" filter="url(#grain)" opacity="0.4"/>
</svg>
