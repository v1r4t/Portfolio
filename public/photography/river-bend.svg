<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="A river bending through a wide valley">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3e7ea"/>
      <stop offset="0.55" stop-color="#f0ead8"/>
      <stop offset="1" stop-color="#f8dfb9"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9e9e8"/>
      <stop offset="1" stop-color="#79b8c2"/>
    </linearGradient>
    <filter id="grain">
