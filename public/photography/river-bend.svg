      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="880" cy="210" r="62" fill="#fff3cd" opacity="0.9"/>
  <path d="M0 430 L160 348 L330 430 L510 330 L700 435 L890 350 L1070 432 L1200 380 L1200 800 L0 800 Z" fill="#8fae9a" opacity="0.75"/>
  <path d="M0 500 L190 420 L380 505 L580 415 L780 510 L980 430 L1200 505 L1200 800 L0 800 Z" fill="#5f8672"/>
  <path d="M0 590 L200 520 L400 600 L610 515 L820 605 L1030 535 L1200 595 L1200 800 L0 800 Z" fill="#3d6355"/>
  <path d="M560 470 C630 505 720 520 660 565 C600 610 500 620 540 665 C575 705 690 715 760 705 L820 760 C700 780 590 770 520 735 C450 700 480 660 520 625 C560 590 600 575 570 545 Z" fill="url(#water)"/>
  <path d="M560 470 C620 505 700 520 645 560 C590 600 505 612 542 652 C578 690 680 700 748 694" fill="none" stroke="#eafafa" stroke-width="6" opacity="0.6"/>
  <g fill="#2c4a40">
    <path d="M180 620 l8 -70 h8 l10 70 Z"/>
    <circle cx="188" cy="550" r="26"/>
    <path d="M900 600 l8 -62 h8 l9 62 Z"/>
    <circle cx="908" cy="536" r="23"/>
